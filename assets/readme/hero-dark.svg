<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>报告首页示意图：决断卡五行 + 赚不赚钱面板</title>
  <desc>金山办公 688111 的真实分析结论：部分好 / 变好但仅注意力 / 已被价格计入 / 高尾险 / 先观察等证据临界</desc>
  <rect width="920" height="470" rx="10" fill="#111110"/>

  <!-- 页眉 -->
  <text x="28" y="40" font-size="19" font-weight="700" fill="#f2f1ec">金山办公 688111.SH</text>
  <text x="212" y="40" font-size="13" fill="#9a9890">2026-09-16 · 一眼结论</text>
  <rect x="762" y="24" width="130" height="22" rx="11" fill="#1c2a3d"/>
  <text x="827" y="39" font-size="12" fill="#6fa8f0" text-anchor="middle">lint 18 条全过</text>

  <!-- 事实条 -->
  <rect x="28" y="56" width="864" height="40" rx="6" fill="#232321"/>
  <text x="44" y="73" font-size="11" fill="#9a9890">行动档位</text>
  <text x="44" y="89" font-size="14" font-weight="650" fill="#f2f1ec">等证据临界</text>
  <text x="190" y="73" font-size="11" fill="#9a9890">质地</text>
  <text x="190" y="89" font-size="14" font-weight="650" fill="#f2f1ec">部分好</text>
  <text x="310" y="73" font-size="11" fill="#9a9890">现价</text>
  <text x="310" y="89" font-size="14" font-weight="650" fill="#f2f1ec">225.52 元</text>
  <text x="450" y="73" font-size="11" fill="#9a9890">合理价区间</text>
  <text x="450" y="89" font-size="14" font-weight="650" fill="#f2f1ec">133.3–193.8 元</text>
  <text x="650" y="73" font-size="11" fill="#9a9890">下次预约披露</text>
  <text x="650" y="89" font-size="14" font-weight="650" fill="#f2f1ec">2026-10-28</text>

  <!-- 决断卡五瓦片 -->
  <text x="28" y="126" font-size="13" font-weight="650" fill="#c6c5bb">投资决断卡</text>

  <g>
    <rect x="28" y="136" width="168" height="126" rx="6" fill="#1b1b1a" stroke="#2f2f2c"/>
    <rect x="28" y="136" width="4" height="126" fill="#e77070"/>
    <text x="45" y="156" font-size="11.5" fill="#9a9890">① 是不是好公司</text>
    <text x="45" y="178" font-size="16" font-weight="750" fill="#f2f1ec">部分好</text>
    <text x="45" y="200" font-size="11.5" fill="#c6c5bb">真护城河真主营,但本</text>
    <text x="45" y="216" font-size="11.5" fill="#c6c5bb">期利润被 17.56 亿基金</text>
    <text x="45" y="232" font-size="11.5" fill="#c6c5bb">账面重估冲花</text>
    <rect x="45" y="240" width="62" height="16" rx="8" fill="#3a2321"/>
    <text x="76" y="252" font-size="10.5" fill="#e77070" text-anchor="middle">🟠 2 条</text>
  </g>

  <g>
    <rect x="204" y="136" width="168" height="126" rx="6" fill="#1b1b1a" stroke="#2f2f2c"/>
    <rect x="204" y="136" width="4" height="126" fill="#e0b23c"/>
    <text x="221" y="156" font-size="11.5" fill="#9a9890">② 在变好吗</text>
    <text x="221" y="178" font-size="14" font-weight="750" fill="#f2f1ec">↑变好但仅注意力</text>
    <text x="221" y="196" font-size="14" font-weight="750" fill="#f2f1ec">·未确认</text>
    <text x="221" y="216" font-size="11.5" fill="#c6c5bb">主营三条线一起提速是</text>
    <text x="221" y="232" font-size="11.5" fill="#c6c5bb">实锤,AI 收入仍为零</text>
    <rect x="221" y="240" width="62" height="16" rx="8" fill="#38301c"/>
    <text x="252" y="252" font-size="10.5" fill="#e0b23c" text-anchor="middle">🟡 2 条</text>
  </g>

  <g>
    <rect x="380" y="136" width="168" height="126" rx="6" fill="#1b1b1a" stroke="#2f2f2c"/>
    <rect x="380" y="136" width="4" height="126" fill="#e77070"/>
    <text x="397" y="156" font-size="11.5" fill="#9a9890">③ 贵不贵</text>
    <text x="397" y="178" font-size="16" font-weight="750" fill="#f2f1ec">已被价格计入</text>
    <text x="397" y="200" font-size="11.5" fill="#c6c5bb">合理价区间 133.3–</text>
    <text x="397" y="216" font-size="11.5" fill="#c6c5bb">193.8 元 vs 现价</text>
    <text x="397" y="232" font-size="11.5" fill="#c6c5bb">225.52 元</text>
    <rect x="397" y="240" width="62" height="16" rx="8" fill="#3a2321"/>
    <text x="428" y="252" font-size="10.5" fill="#e77070" text-anchor="middle">🟠 3 条</text>
  </g>

  <g>
    <rect x="556" y="136" width="168" height="126" rx="6" fill="#1b1b1a" stroke="#2f2f2c"/>
    <rect x="556" y="136" width="4" height="126" fill="#e77070"/>
    <text x="573" y="156" font-size="11.5" fill="#9a9890">④ 扛得住吗</text>
    <text x="573" y="178" font-size="16" font-weight="750" fill="#f2f1ec">高尾险·不可承受</text>
    <text x="573" y="200" font-size="11.5" fill="#c6c5bb">公司本身不会死,但持</text>
    <text x="573" y="216" font-size="11.5" fill="#c6c5bb">有人一路上没有护栏;</text>
    <text x="573" y="232" font-size="11.5" fill="#c6c5bb">高信仰 5/7</text>
    <rect x="573" y="240" width="62" height="16" rx="8" fill="#3a2321"/>
    <text x="604" y="252" font-size="10.5" fill="#e77070" text-anchor="middle">🟠 2 条</text>
  </g>

  <g>
    <rect x="732" y="136" width="160" height="126" rx="6" fill="#1b1b1a" stroke="#2f2f2c"/>
    <rect x="732" y="136" width="4" height="126" fill="#e0b23c"/>
    <text x="749" y="156" font-size="11.5" fill="#9a9890">⑤ 怎么办</text>
    <text x="749" y="178" font-size="15" font-weight="750" fill="#f2f1ec">先观察等证据临界</text>
    <text x="749" y="200" font-size="11.5" fill="#c6c5bb">现价 0 仓位,等三季报</text>
    <text x="749" y="216" font-size="11.5" fill="#c6c5bb">的两条硬数据 + 价格回</text>
    <text x="749" y="232" font-size="11.5" fill="#c6c5bb">到合理价区间以内</text>
  </g>

  <!-- 赚钱面板 -->
  <text x="28" y="294" font-size="13" font-weight="650" fill="#c6c5bb">赚不赚钱面板</text>
  <text x="130" y="294" font-size="11.5" fill="#9a9890">指标由①质地挑选,红标由脚本按红旗清单反查,不是人工涂色</text>

  <g>
    <rect x="28" y="304" width="280" height="104" rx="6" fill="#1b1b1a" stroke="#2f2f2c"/>
    <text x="44" y="326" font-size="12.5" fill="#9a9890">毛利率</text>
    <text x="44" y="352" font-size="21" font-weight="650" fill="#f2f1ec">84.90%</text>
    <text x="126" y="352" font-size="12" fill="#9a9890">(2026H1)</text>
    <text x="44" y="374" font-size="11.5" fill="#c6c5bb">四个半年度稳定在 84.9~86.1%,</text>
    <text x="44" y="390" font-size="11.5" fill="#c6c5bb">规模扩大未被摊薄</text>
    <polyline points="196,344 218,341 240,346 262,340 284,338" fill="none" stroke="#3987e5" stroke-width="2"/>
    <circle cx="284" cy="338" r="2.6" fill="#3987e5"/>
    <text x="240" y="326" font-size="10.5" fill="#9a9890" text-anchor="end">20% 分位</text>
  </g>

  <g>
    <rect x="320" y="304" width="280" height="104" rx="6" fill="#1b1b1a" stroke="#2f2f2c"/>
    <rect x="320" y="304" width="280" height="3" fill="#e77070"/>
    <text x="336" y="326" font-size="12.5" fill="#9a9890">净利率(报表口径)</text>
    <text x="336" y="352" font-size="21" font-weight="650" fill="#f2f1ec">75.99%</text>
    <text x="336" y="374" font-size="11.5" fill="#c6c5bb">这个数不是主营赚出来的,直接</text>
    <text x="336" y="390" font-size="11.5" fill="#c6c5bb">拿去和同行比会看反</text>
    <polyline points="488,352 510,350 532,348 554,346 576,318" fill="none" stroke="#e66767" stroke-width="2"/>
    <circle cx="576" cy="318" r="2.6" fill="#e66767"/>
    <rect x="500" y="315" width="76" height="16" rx="8" fill="#3a2321"/>
    <text x="538" y="327" font-size="10.5" fill="#e77070" text-anchor="middle">🟠 高级红旗</text>
  </g>

  <g>
    <rect x="612" y="304" width="280" height="104" rx="6" fill="#1b1b1a" stroke="#2f2f2c"/>
    <text x="628" y="326" font-size="12.5" fill="#9a9890">现金含量(OCF÷归母净利)</text>
    <text x="628" y="352" font-size="21" font-weight="650" fill="#f2f1ec">0.26x</text>
    <text x="690" y="352" font-size="12" fill="#9a9890">(2026H1)</text>
    <text x="628" y="374" font-size="11.5" fill="#c6c5bb">三个上半年稳在 0.87~0.99x,</text>
    <text x="628" y="390" font-size="11.5" fill="#c6c5bb">本期断崖</text>
    <polyline points="780,340 802,338 824,342 846,339 868,376" fill="none" stroke="#e66767" stroke-width="2"/>
    <circle cx="868" cy="376" r="2.6" fill="#e66767"/>
  </g>

  <!-- 页脚 -->
  <line x1="28" y1="428" x2="892" y2="428" stroke="#2f2f2c"/>
  <text x="28" y="450" font-size="11.5" fill="#9a9890">决断卡 / 面板 / Top3 风险全部由脚本从五个节点的机器块装配 —— 人工只写导读那 3-5 句</text>
</svg>
