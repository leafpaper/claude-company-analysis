/* ---------- 切换器 ---------- */
const VARIANTS = [
  {k:'A', name:'档案 · 研报文档', render:renderA},
  {k:'B', name:'仪表盘 · 一眼决断', render:renderB},
  {k:'B2', name:'仪表盘 · 减压改版', render:renderB2},
  {k:'C', name:'判断链 · 结构即导航', render:renderC}
];
function curKey(){
  try{ const p = new URLSearchParams(location.search).get('variant'); if(VARIANTS.some(v => v.k === p)) return p; }catch(e){}
  return 'A';
}
function setKey(k){
  try{ const u = new URL(location.href); u.searchParams.set('variant', k); history.replaceState(null, '', u); }catch(e){}
  render(k);
}
function render(k){
  k = k || curKey();
  const v = VARIANTS.find(x => x.k === k);
  document.getElementById('root').innerHTML = v.render();
  document.getElementById('swlab').innerHTML = `${v.k} — ${v.name}<small>${VARIANTS.findIndex(x => x.k === k) + 1}/${VARIANTS.length}</small>`;
}
function step(d){
  const i = VARIANTS.findIndex(x => x.k === curKey());
  setKey(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].k);
}
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if(!a) return;
  const el = document.getElementById(a.getAttribute('href').slice(1));
  if(el && el.tagName === 'DETAILS') el.open = true;
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if(e.key === 'ArrowLeft') step(-1);
  if(e.key === 'ArrowRight') step(1);
});
render();
</script>
